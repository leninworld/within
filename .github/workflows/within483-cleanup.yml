name: Validate wire fixture cleanup
on:
  push:
    branches: [codex/validate-within483-wire-cleanup]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - name: Anchor the job clock
        run: echo "VALIDATION_JOB_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: packet
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: py-econometrics/within
          ref: 94a497e7c6708c7c6ddd6a8e8f54f6f258f714f6
          path: source
          persist-credentials: false
      - name: Validate test cleanup in Docker
        run: python3 packet/host.py
